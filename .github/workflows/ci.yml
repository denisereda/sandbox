  deploy:
    name: Deploy
    needs: [version, test, build-ghcr]
    # Деплой выполняется только для main или при ручном запуске.
    # always() нужен, чтобы ручной откат работал при пропущенной сборке.
    if: |
      always() &&
      needs.version.result == 'success' &&
      needs.test.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.build-ghcr.result != 'failure' &&
      needs.build-ghcr.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # environment: production
    # Деплой не отменяем: параллельные запуски выполняются строго по очереди.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .env нужен docker-compose: имена образов в ghcr.io и тег версии.
      - name: Prepare .env
        run: |
          cat > .env <<EOF
          REPOSITORY_BACKEND=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox-backend
          REPOSITORY_FRONTEND=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox-frontend
          IMAGE_TAG=${{ needs.version.outputs.version }}
          EOF

      - name: Deploy to VM
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS=(
            -i "$HOME/.ssh/deploy_key"
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o "StrictHostKeyChecking=yes"
          )

          ssh "${SSH_OPTS[@]}" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            'sudo mkdir -p /opt/sandbox && sudo chown "$(id -u):$(id -g)" /opt/sandbox'

          scp "${SSH_OPTS[@]}" docker-compose.yml .env deploy-docker-compose-ci.sh \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/sandbox/"

          # Пароль GHCR передаём только через stdin, чтобы он не попал в лог и список процессов.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh "${SSH_OPTS[@]}" \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd /opt/sandbox && REGISTRY_USER='${{ github.actor }}' bash ./deploy-docker-compose-ci.sh"
