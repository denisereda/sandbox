name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      VERSION:
        description: "Версия для повторного деплоя или отката (например, 20261111-101500). Пусто — собрать новую."
        required: false
        type: string

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.VERSION }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}"

  test:
    name: Test backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Устаревший прогон тестов отменяется новым пушем в ту же ветку.
    # Отдельная группа: job'ы в одной группе отменяли бы друг друга.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          mkdir -p reports
          set -o pipefail
          docker run --rm \
            -v "$PWD/src/backend:/src" -w /src \
            -v "$PWD/reports:/reports" \
            golang:alpine \
            go test -v -coverprofile=/reports/coverage.out ./... \
            | tee reports/test.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn

  build-ghcr:
    name: Build ${{ matrix.component }} (GHCR)
    needs: [version, test]
    # При ручном запуске с VERSION образы не пересобираются:
    # версия уже существует и используется для повторного деплоя/отката.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.VERSION == '' }}
    # Новый пуш в ту же ветку отменяет устаревшую сборку.
    # concurrency:
    #   group: build-ghcr-${{ github.ref }}
    #   cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      COMPONENT: ${{ matrix.component }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sandbox-${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAGS=(
            --tag "${IMAGE}:${VERSION}"
            --tag "${IMAGE}:sha-${SHORT_SHA}"
          )

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi

          docker build \
            --file "./src/${COMPONENT}/Dockerfile" \
            "${TAGS[@]}" \
            "./src/${COMPONENT}"

      - name: Push image to GHCR
        run: docker push --all-tags "${IMAGE}"

