services:
  backend:
    # Образ из registry, указанного в .env (REPOSITORY_BACKEND + IMAGE_TAG)
    image: "${REPOSITORY_BACKEND:-${REGISTRY_BACKEND}/sandbox-backend}:${IMAGE_TAG:-latest}"
    container_name: sandbox-backend
    env_file:
      - .env
    networks:
      - sandbox
    expose:
      - "8081"
    # Для сборки в ходе отладки
    # build:
    #   context: ./src/backend
    #   dockerfile: Dockerfile
    healthcheck:
      test: curl --fail -s http://localhost:8081/products
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 6
 
  frontend:
    # Образ из registry, указанного в .env (REPOSITORY_FRONTEND + IMAGE_TAG)
    image: "${REPOSITORY_FRONTEND:-${REGISTRY_FRONTEND}/sandbox-frontend}:${IMAGE_TAG:-latest}"
    container_name: sandbox-frontend
    env_file:
      - .env
    networks:
      - sandbox 
    ports:
      - "8889:8888"
    # Для автоматизации масштабирования backend
    # volumes:
    #   - "/var/run/docker.sock:/tmp/docker.sock:ro"
    depends_on:
      - backend
    # Для сборки в ходе отладки
    # build:
    #   context: ./src/frontend
    #   dockerfile: Dockerfile

networks:
  sandbox: