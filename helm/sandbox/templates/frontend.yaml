apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
  labels:
    app: sandbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend
  template:
    metadata:
      labels:
        app: sandbox-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          #   initialDelaySeconds: 20
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 6
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-frontend
  labels:
    app: sandbox-frontend
spec:
  type: NodePort
  selector:
    app: sandbox-frontend
  ports:
    - name: http
      port: 8888
      targetPort: http
      nodePort: {{ .Values.nodePort }}
      protocol: TCP
