apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-backend
  template:
    metadata:
      labels:
        app: sandbox-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   failureThreshold: 30
          #   periodSeconds: 2
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          #   timeoutSeconds: 3
          #   failureThreshold: 3
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          #   initialDelaySeconds: 20
          #   periodSeconds: 30
          #   timeoutSeconds: 10
          #   failureThreshold: 6
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-backend
  labels:
    app: sandbox-backend
spec:
  type: ClusterIP
  selector:
    app: sandbox-backend
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
